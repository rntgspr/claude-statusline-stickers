version: 9
domain: sdlc-full
rules:
  markdown: {required_heading: h1, frontmatter: {human_revised: {}, summary: {}}}
  index_md: {frontmatter: {targets: {}}}
  pillar_index: {frontmatter: {targets: {}, summary: {}}}
root:
  framework: true
  frontmatter: {depends-on: {optional: true}}
  domain.md: {framework: true, tags: [components, root]}
  disciplines: {framework: true, "*.md": {framework: true}}
  roles: {framework: true, tags: [roles], "*.md": {framework: true}}
  templates:
    framework: true
    tags: [templates]
    handoff.md: {framework: true, tags: [touched]}
    spec.md: {framework: true, tags: [reference]}
    "*.md": {framework: true}
  intake:
    framework: true
    "*.md": {frontmatter: {key: {}, type: {}, tracker: {}, status: {}, synced-at: {}, targets: {}, relates: {optional: true}}}
  plans:
    framework: true
    "*":
      frontmatter: {scope: {}, status: {}, summary: {}, targets: {}, key: {optional: true}, type: {optional: true}, epic: {optional: true}, story: {optional: true}, aux: {optional: true}}
      "t*.md": {frontmatter: {plan: {}, task: {}, depends-on: {}, concerns: {}, files: {}, status: {}, targets: {}, aux: {}}}
      "handoff-t*.md": {frontmatter: {plan: {}, task: {}, status: {}, date: {}}, tags: [touched]}
      delta-draft.md: {optional: true, frontmatter: {plan: {}, status: {}, date: {}}}
  # Local pillar: transient close-out staging between plan close and spec absorption.
  archive:
    "*":
      optional: true
      frontmatter: {scope: {}, status: {}, summary: {}, targets: {}, completed-at: {}, delta: {optional: true}, key: {optional: true}, type: {optional: true}, epic: {optional: true}, story: {optional: true}, aux: {optional: true}}
      delta.md: {frontmatter: {plan: {}, date: {}, targets: {optional: true}}}
  specs:
    framework: true
    "*": {frontmatter: {name: {}, summary: {}, depends-on: {}, relates: {optional: true}, targets: {}}, "*.md": {frontmatter: {name: {}, summary: {}, depends-on: {}, relates: {optional: true}, targets: {}}}}
  exploring: {framework: true, "*": {optional: true, frontmatter: {status: {}, summary: {}, targets: {}}}}
  issues: {framework: true, "*": {frontmatter: {type: {}, priority: {}, status: {}, summary: {}, targets: {}}, tags: [reference]}}
meta:
  targets:
    values:
      - engine     # claude_statusline_stickers/ - Python font-build engine (fontTools/Pillow)
      - themes     # claude_statusline_stickers/themes/ - theme.json + 256px sprite PNGs
      - statusline # claude_statusline_stickers/statusline/ - Claude Code statusline renderer
      - platform
      - meta
  specification_dir: specs
  coverage:
    source:
      - "claude_statusline_stickers/**"
